name: Hisense Phase A Launcher
on:
  workflow_dispatch:
  push:
    branches: ['feature/hisense-phase-a-launcher']
    paths: ['launcher/**', 'scripts/ci/phase-a-*', 'scripts/phase-a-recovery.py', 'scripts/phase-a-recovery.cjs', 'tests/test_phase_a_recovery.py', '.github/workflows/phase-a-launcher.yml']
permissions:
  contents: read
jobs:
  phase-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check recovery guards
        run: |
          python3 -m unittest discover -s tests -p test_phase_a_recovery.py -v
          node --test scripts/tests/phase-a-recovery.test.cjs
      - name: Build and check Phase A and Preview
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PincludePhaseA=true -PincludeNativePreview=true :phase-a-launcher:testDebugUnitTest :phase-a-launcher:lintDebug :phase-a-launcher:assembleDebug :phase-a-launcher:assembleDebugAndroidTest :entertainment-preview:testDebugUnitTest :entertainment-preview:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android TV 11 Home and recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          emulator-boot-timeout: 900
          emulator-options: '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim'
          script: python3 scripts/ci/phase-a-emulator.py
      - name: Preserve APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Phase-A-Android11
          path: |
            launcher/phase-a-launcher/build/outputs/apk/debug/*.apk
            launcher/phase-a-launcher/build/reports/
            artifacts/phase-a/
          retention-days: 30
