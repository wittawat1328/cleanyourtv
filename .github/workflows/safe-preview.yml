name: Safe TV Preview and Emulator
on:
  workflow_dispatch:
  push:
    branches: ['feature/**']
    paths:
      - '.github/workflows/safe-preview.yml'
      - 'preview/**'
      - 'scripts/ci/tv-emulator-smoke.sh'
  pull_request:
    paths:
      - '.github/workflows/safe-preview.yml'
      - 'preview/**'
      - 'scripts/ci/tv-emulator-smoke.sh'
permissions:
  contents: read
jobs:
  web-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        working-directory: preview
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npx playwright install --with-deps chromium
      - name: Browser tests and screenshots
        working-directory: preview
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-web-preview
          path: |
            preview/index.html
            artifacts/web-preview/
          retention-days: 14
          if-no-files-found: warn
  android-tv-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test native Launcher
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native TV emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          emulator-boot-timeout: 900
          emulator-options: '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim'
          script: bash scripts/ci/tv-emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-emulator-results
          path: artifacts/tv-emulator/
          retention-days: 14
          if-no-files-found: warn
