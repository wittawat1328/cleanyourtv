plugins {
    id 'com.android.application'
}
android {
    namespace 'com.wittawat.cleanyourtv.preview'
    compileSdk 34
    defaultConfig {
        applicationId 'com.wittawat.cleanyourtv.preview'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1-native-preview'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
