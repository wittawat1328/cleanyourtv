plugins { id 'com.android.application' }
android {
    namespace 'com.wittawat.cleanyourtv.preview'
    compileSdk 34
    defaultConfig {
        applicationId 'com.wittawat.cleanyourtv.launcher'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2-phase-a'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    sourceSets { main.res.srcDirs += ['../entertainment-preview/src/main/res'] }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
