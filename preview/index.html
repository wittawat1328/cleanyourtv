<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanYourTV Safe Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1423;color:white;font:500 16px/1.5 system-ui,"Noto Sans Thai",sans-serif}.wrap{max-width:1200px;margin:auto;padding:20px}h1{font-size:24px;margin:0}p{color:#b9cce1}.tv{border:1px solid #5e7297;border-radius:17px;overflow:hidden;aspect-ratio:16/9;position:relative;background:radial-gradient(circle at 70% 18%,#385376,transparent 44%),linear-gradient(120deg,#0b203c,#111522)}.tv.aurora{background:radial-gradient(circle at 75% 15%,#b383b0,transparent 45%),linear-gradient(120deg,#242a52,#4b2d5e)}.tv.ocean{background:radial-gradient(circle at 75% 15%,#45b9cf,transparent 45%),linear-gradient(120deg,#051b39,#145b75)}.tv.forest{background:radial-gradient(circle at 75% 15%,#83c18b,transparent 45%),linear-gradient(120deg,#0b2527,#125743)}.screen{height:100%;display:flex;flex-direction:column;padding:3% 5%}.top,.foot{display:flex;justify-content:space-between;align-items:center;font-size:clamp(9px,1.3vw,18px)}.top b{letter-spacing:.1em}.clock{font-size:clamp(19px,3vw,40px);font-weight:300}.hero{margin-top:auto;margin-bottom:3%}.hero small{font-size:clamp(9px,1.4vw,17px);opacity:.8}.hero h2{font-size:clamp(24px,4.8vw,58px);margin:0 0 2px}.hero p{margin:0;font-size:clamp(9px,1.2vw,15px)}.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1.5%;margin-bottom:3%}.tile{color:white;cursor:pointer;font-size:clamp(8px,1.3vw,17px);font-weight:750;border:2px solid #ffffff50;background:#3b5377;border-radius:clamp(6px,1.4vw,17px);aspect-ratio:1.8;min-width:0;transition:.15s}.tile:nth-child(1){background:#ba1d2d}.tile:nth-child(2){background:#112b71}.tile:nth-child(3){background:#165c89}.tile:nth-child(4){background:#363844}.tile:nth-child(5){background:#166654}.tile.active{outline:2px solid #b7e9ff;border-color:white;transform:scale(1.05);box-shadow:0 10px 30px #0007}.foot{opacity:.8}.tools{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:18px}.panel{border:1px solid #31465e;background:#172638;border-radius:12px;padding:14px}.panel h3{margin:0 0 12px;font-size:15px}.ctrl{padding:9px 13px;margin:2px;background:#2d4662;color:white;border:1px solid #7087a7;border-radius:10px;cursor:pointer}.ctrl.selected{background:#eff8ff;color:#162239}.overlay{position:absolute;inset:0;background:#010814b9;display:none;align-items:center;justify-content:center}.overlay.on{display:flex}.dialog{text-align:center;background:#14263d;border:1px solid #778aa7;border-radius:13px;padding:26px}.dialog p{font-size:13px}@media(max-width:650px){.tools{grid-template-columns:1fr}.wrap{padding:12px}.tv{border-radius:8px}h1{font-size:21px}}
</style></head><body><main class="wrap"><h1>CleanYourTV · Safe Preview</h1><p>UI จำลองบนมือถือ — ไม่เชื่อมต่อทีวีจริงและไม่เรียก ADB</p><section id="tv" class="tv" tabindex="0"><div class="screen"><div class="top"><b>◉ CLEAN YOUR TV</b><span>● Wi-Fi · Demo</span><span class="clock">20:26</span></div><div class="hero"><small>WELCOME HOME</small><h2 id="hero">YouTube</h2><p>เลือกแอปด้วยปุ่มรีโมตด้านล่าง</p></div><div class="tiles"><button class="tile active" data-name="YouTube">▶ YouTube</button><button class="tile" data-name="Netflix">NETFLIX</button><button class="tile" data-name="Prime Video">prime video</button><button class="tile" data-name="Live TV">LIVE TV</button><button class="tile" data-name="Settings">⚙ Settings</button></div><div class="foot"><span>← ↑ ↓ → เลือก · OK ดูตัวอย่าง</span><span>PREVIEW ONLY</span></div></div><div id="overlay" class="overlay" role="dialog"><div class="dialog"><h3 id="dialog-title">Preview</h3><p>นี่เป็นตัวอย่าง ไม่ได้เปิดแอปบนทีวีจริง</p><button id="close" class="ctrl">ปิด</button></div></div></section><div class="tools"><div class="panel"><h3>ธีมตัวอย่าง</h3><button class="ctrl selected" data-theme="default">Midnight</button><button class="ctrl" data-theme="aurora">Aurora</button><button class="ctrl" data-theme="ocean">Ocean</button><button class="ctrl" data-theme="forest">Forest</button></div><div class="panel"><h3>รีโมตจำลอง</h3><button class="ctrl" data-key="ArrowLeft">◀</button><button class="ctrl" data-key="ArrowUp">▲</button><button class="ctrl" data-key="Enter">OK</button><button class="ctrl" data-key="ArrowDown">▼</button><button class="ctrl" data-key="ArrowRight">▶</button><button class="ctrl" data-key="Escape">Back</button></div></div></main><script>
(function(){'use strict';var tv=document.getElementById('tv'),tiles=Array.from(document.querySelectorAll('.tile')),hero=document.getElementById('hero'),overlay=document.getElementById('overlay'),i=0;function choose(n){i=(n+tiles.length)%tiles.length;tiles.forEach(function(t,x){t.classList.toggle('active',x===i);});hero.textContent=tiles[i].dataset.name;}function press(k){if(overlay.classList.contains('on')){if(k==='Enter'||k==='Escape')overlay.classList.remove('on');return;}if(k==='ArrowRight'||k==='ArrowDown')choose(i+1);if(k==='ArrowLeft'||k==='ArrowUp')choose(i-1);if(k==='Enter'){document.getElementById('dialog-title').textContent=tiles[i].dataset.name;overlay.classList.add('on');}}document.addEventListener('keydown',function(e){if(['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','Enter','Escape'].includes(e.key)){e.preventDefault();press(e.key);}});document.querySelectorAll('[data-key]').forEach(function(b){b.addEventListener('click',function(){press(b.dataset.key);tv.focus({preventScroll:true});});});tiles.forEach(function(t,x){t.addEventListener('click',function(){choose(x);press('Enter');});});document.getElementById('close').addEventListener('click',function(){overlay.classList.remove('on');});document.querySelectorAll('[data-theme]').forEach(function(b){b.addEventListener('click',function(){tv.className='tv'+(b.dataset.theme==='default'?'':' '+b.dataset.theme);document.querySelectorAll('[data-theme]').forEach(function(x){x.classList.toggle('selected',x===b);});});});})();
</script></body></html>
